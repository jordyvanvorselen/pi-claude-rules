name: publish

# Publishes when the version in package.json is not on npm yet.
# The ci workflow fails pull requests that do not bump the version.
on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  publish:
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v4
